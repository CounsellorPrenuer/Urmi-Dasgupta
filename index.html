<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Redirecting...</title>
  <script type="text/javascript">
    // Force a non-cached fetch of the dist folder
    var time = new Date().getTime();
    window.location.replace("dist/?v=" + time);

    // Global Audio Unlocker for Mobile
    function unlockAudio() {
      var videos = document.getElementsByTagName('video');
      for (var i = 0; i < videos.length; i++) {
        try {
          videos[i].muted = false;
          videos[i].volume = 1.0;
          videos[i].play();
        } catch (e) { }
      }
      // Remove listeners once unlocked
      document.removeEventListener('touchstart', unlockAudio);
      document.removeEventListener('click', unlockAudio);
      document.removeEventListener('scroll', unlockAudio);
    }

    document.addEventListener('touchstart', unlockAudio, { passive: true });
    document.addEventListener('click', unlockAudio, { passive: true });
    document.addEventListener('scroll', unlockAudio, { passive: true });
  </script>
</head>

<body>
  <p>Loading latest version... <a href="dist/">Click here if not redirected</a>.</p>
</body>

</html>
